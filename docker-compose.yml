version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seosuite-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: seosuite_user
      POSTGRES_PASSWORD: seosuite_password
      POSTGRES_DB: seosuite_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
